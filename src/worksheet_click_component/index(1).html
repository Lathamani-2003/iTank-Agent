<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
    }
    #root {
      position: relative;
      width: 100%;
      line-height: 0;
      background: transparent;
    }
    #diagram {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      z-index: 2;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .hotspot:focus,
    .hotspot:active,
    .hotspot:hover {
      border: 0;
      outline: 0;
      background: transparent;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    let lastArgsSignature = "";

    function post(type, extra = {}) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type }, extra),
        "*"
      );
    }

    function setFrameHeight() {
      const height = Math.ceil(root.getBoundingClientRect().height || document.body.scrollHeight || 1);
      post("streamlit:setFrameHeight", { height });
    }

    function setComponentValue(value) {
      post("streamlit:setComponentValue", { value });
    }

    function render(args) {
      const imageB64 = args && args.image_b64 ? String(args.image_b64) : "";
      const hotspots = Array.isArray(args && args.hotspots) ? args.hotspots : [];
      const signature = JSON.stringify([imageB64.length, hotspots]);
      if (signature === lastArgsSignature && root.childElementCount) {
        setFrameHeight();
        return;
      }
      lastArgsSignature = signature;
      root.innerHTML = "";

      const image = document.createElement("img");
      image.id = "diagram";
      image.alt = "Generated worksheet diagram";
      image.src = "data:image/png;base64," + imageB64;
      image.onload = () => {
        setFrameHeight();
        requestAnimationFrame(setFrameHeight);
      };
      root.appendChild(image);

      hotspots.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hotspot";
        button.title = item.title || ("Add another " + item.component);
        button.setAttribute("aria-label", button.title);
        button.style.left = Number(item.left || 0) + "%";
        button.style.top = Number(item.top || 0) + "%";
        button.style.width = Number(item.width || 0) + "%";
        button.style.height = Number(item.height || 0) + "%";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setComponentValue({
            component: String(item.component || ""),
            instance_id: String(item.instance_id || ""),
            event_id: Date.now().toString(36) + "_" + Math.random().toString(36).slice(2)
          });
        });
        root.appendChild(button);
      });

      requestAnimationFrame(setFrameHeight);
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      render(data.args || {});
    });

    window.addEventListener("resize", () => requestAnimationFrame(setFrameHeight));

    post("streamlit:componentReady", { apiVersion: 1 });
    post("streamlit:setFrameHeight", { height: 1 });
  </script>
</body>
</html>
