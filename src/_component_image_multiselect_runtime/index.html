<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
*{box-sizing:border-box}
#root{width:100%;min-height:50px}
.control{
  width:100%;height:48px;border:1px solid #cfd8e3;border-radius:8px;background:#fff;
  display:flex;align-items:center;padding:0 10px;gap:6px;color:#303846
}
.control.open{border-color:#ff4b4b;box-shadow:0 0 0 1px #ff4b4b}
.chips{display:flex;align-items:center;gap:5px;max-width:68%;overflow:hidden}
.chip{
  display:flex;align-items:center;background:#ff4b4b;color:#fff;border-radius:5px;
  padding:5px 8px;font-size:13px;white-space:nowrap;max-width:145px;overflow:hidden;text-overflow:ellipsis
}
.more{font-size:12px;color:#68778c;white-space:nowrap}
.input{
  flex:1 1 auto;min-width:24px;height:40px;border:0;outline:0;background:transparent;
  font-size:14px;color:#303846;padding:0
}
.input::placeholder{color:#7a8798;opacity:1}
.clear{font-size:16px;color:#7d8793;cursor:pointer;flex:0 0 auto;line-height:1}
.arrow{font-size:16px;color:#2f3945;cursor:pointer;flex:0 0 auto;line-height:1}
.menu{
  margin-top:5px;width:100%;background:#fff;border:1px solid #e7ebf0;border-radius:9px;
  box-shadow:0 8px 22px rgba(16,24,40,.18);max-height:350px;overflow-y:auto;overflow-x:hidden;
  padding:4px 0
}
.row{
  min-height:48px;padding:4px 10px;display:flex;align-items:center;gap:10px;color:#303846;
  font-size:14px;cursor:pointer;background:#fff
}
.row:hover{background:#f1f3f6}
.row.select-all{min-height:44px;border-bottom:1px solid #e5e7eb;margin-bottom:3px}
.name{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:36px;height:36px;object-fit:contain;flex:0 0 36px;pointer-events:none}
.thumb-empty{width:36px;height:36px;flex:0 0 36px}
.check{width:16px;flex:0 0 16px;text-align:center;color:#0a66e3;font-weight:800}
.empty{padding:14px;color:#7a8798;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="./main.js?v=component-image-dropdown-v1"></script>
</body>
</html>
