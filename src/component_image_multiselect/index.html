<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;padding:0;width:100%;min-height:50px;background:transparent;
  font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:visible
}
*{box-sizing:border-box}
#root{width:100%;min-height:50px;position:relative;overflow:visible}
.wrap{width:100%;position:relative;overflow:visible}
.control{
  width:100%;height:40px;min-height:40px;border:1px solid #cfd8e3;border-radius:8px;
  background:#fff;display:flex;align-items:center;padding:0 11px;gap:6px;
  color:#303846;cursor:text;margin-top:5px
}
.control.open{border-color:#ff4b4b;box-shadow:0 0 0 1px #ff4b4b}
.input{
  border:0;outline:0;background:transparent;flex:1 1 auto;min-width:0;height:36px;
  font-size:14px;color:#303846;padding:0
}
.input::placeholder{color:#7a8798;opacity:1}
.summary{display:flex;align-items:center;gap:5px;max-width:55%;overflow:hidden;white-space:nowrap}
.chip{background:#f0f2f6;border-radius:5px;padding:3px 6px;font-size:12px;max-width:135px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:12px;color:#68778c}
.arrow{font-size:18px;color:#303846;line-height:1;flex:0 0 auto;cursor:pointer}
.menu{
  margin-top:5px;width:100%;background:#fff;border:1px solid #e7ebf0;border-radius:9px;
  box-shadow:0 8px 22px rgba(16,24,40,.18);max-height:330px;overflow-y:auto;overflow-x:hidden;
  padding:4px 0;position:relative;z-index:9999
}
.row{
  min-height:46px;padding:4px 12px;display:flex;align-items:center;gap:10px;
  font-size:14px;color:#303846;cursor:pointer;background:#fff
}
.row:hover{background:#f1f3f6}
.row.selected{background:#f7f9fc}
.row.select-all{min-height:43px;border-bottom:1px solid #e5e7eb;margin-bottom:3px}
.name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:36px;height:36px;object-fit:contain;display:block;flex:0 0 36px}
.thumb-empty{width:36px;height:36px;flex:0 0 36px}
.check{width:14px;flex:0 0 14px;text-align:center;color:#0a66e3;font-weight:800}
.empty{padding:12px;color:#7a8798;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="./main.js?v=search-box-visible-20260831-1"></script>
</body>
</html>
